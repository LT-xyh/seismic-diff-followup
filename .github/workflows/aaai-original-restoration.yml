name: aaai-step0-original-restoration
on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  restore-and-compile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: remote-sensing/aaai-stepwise-rebuild
          fetch-depth: 1
          persist-credentials: true

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install figure format exporters
        run: python -m pip install --disable-pip-version-check 'CairoSVG==2.8.2' 'img2pdf==0.6.3'

      - name: Restore original manuscript without editing source content
        shell: bash
        run: |
          set -euo pipefail
          python .github/scripts/restore_aaai_step0.py
          cmp docs/paper/aaaii/pd-bg-rfm.tex docs/paper/RemoteSensing_AAAI_Rebuild/pd-bg-rfm.tex
          cmp docs/paper/aaaii/paper0726.tex docs/paper/RemoteSensing_AAAI_Rebuild/paper0726.tex
          sha256sum docs/paper/aaaii/pd-bg-rfm.tex docs/paper/RemoteSensing_AAAI_Rebuild/pd-bg-rfm.tex

      - name: Commit independent restored workspace to figure-step branch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- docs/paper/RemoteSensing_AAAI_Rebuild/
          git diff --cached --name-only | tee /tmp/aaai-step0-changed-paths
          test -s /tmp/aaai-step0-changed-paths
          if grep -v '^docs/paper/RemoteSensing_AAAI_Rebuild/' /tmp/aaai-step0-changed-paths; then
            echo 'Unexpected staged path; refusing commit.'
            exit 1
          fi
          git commit -m 'restoration: copy exact AAAI-27 source and label artwork-derived exports'
          git push origin HEAD:refs/heads/remote-sensing/aaai-stepwise-rebuild

      - name: Compile historically restored AAAI manuscript
        uses: xu-cheng/latex-action@v4
        with:
          root_file: pd-bg-rfm.tex
          working_directory: docs/paper/RemoteSensing_AAAI_Rebuild
          latexmk_use_xelatex: false

      - name: Verify source hashes and build status
        shell: bash
        run: |
          set -euo pipefail
          cmp docs/paper/aaaii/pd-bg-rfm.tex docs/paper/RemoteSensing_AAAI_Rebuild/pd-bg-rfm.tex
          test -s docs/paper/RemoteSensing_AAAI_Rebuild/pd-bg-rfm.pdf
          python - <<'PY'
          import pathlib,hashlib
          p=pathlib.Path('docs/paper/RemoteSensing_AAAI_Rebuild/pd-bg-rfm.tex')
          got=hashlib.sha256(p.read_bytes()).hexdigest()
          assert got=='51d57b5954516e0040114aee9a3863a4ea5869b78500cde7d4112d6edf4d7e83'
          print('RESTORED_SOURCE_SHA256_PASS',got)
          PY
          pdfinfo docs/paper/RemoteSensing_AAAI_Rebuild/pd-bg-rfm.pdf | grep -E 'Pages:|Page size:|File size:' || true

      - name: Upload reconstructed AAAI PDF
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: aaai-step0-reconstructed-manuscript-pdf
          path: docs/paper/RemoteSensing_AAAI_Rebuild/pd-bg-rfm.pdf
          if-no-files-found: error

      - name: Package restoration assets and provenance
        if: always()
        shell: bash
        run: |
          mkdir -p build/aaai-original-restoration
          if [ -d docs/paper/RemoteSensing_AAAI_Rebuild ]; then
            tar --exclude='*.aux' --exclude='*.log' --exclude='*.fls' --exclude='*.fdb_latexmk'               -czf build/aaai-original-restoration/AAAI_STEP0_RESTORED_SOURCE.tar.gz               -C docs/paper RemoteSensing_AAAI_Rebuild
          fi

      - name: Upload restoration source archive
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: aaai-step0-original-restoration-source
          path: build/aaai-original-restoration/AAAI_STEP0_RESTORED_SOURCE.tar.gz
          if-no-files-found: warn
