name: aaai-step0-original-restoration
on:
  push:
    branches:
      - remote-sensing/aaai-stepwise-rebuild
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify-and-compile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install portable PDF parser
        run: python -m pip install --disable-pip-version-check pypdf==5.9.0

      - name: Audit uploaded original figures and unmodified sources
        shell: bash
        run: |
          set -euo pipefail
          python .github/scripts/audit_aaai_uploaded_pdfs.py
          cmp docs/paper/aaaii/pd-bg-rfm.tex docs/paper/RemoteSensing_AAAI_Rebuild/pd-bg-rfm.tex
          cmp docs/paper/aaaii/paper0726.tex docs/paper/RemoteSensing_AAAI_Rebuild/paper0726.tex

      - name: Upload figure integrity and updated checksum manifest
        uses: actions/upload-artifact@v4
        with:
          name: aaai-step0-verified-figure-hashes
          path: |
            build/aaai-original-restoration/uploaded_figure_integrity.json
            build/aaai-original-restoration/SHA256SUMS.updated.txt
          if-no-files-found: error

      - name: Compile archived AAAI manuscript with uploaded PDF figures
        uses: xu-cheng/latex-action@v4
        with:
          root_file: pd-bg-rfm.tex
          working_directory: docs/paper/RemoteSensing_AAAI_Rebuild
          latexmk_use_xelatex: false

      - name: Check rebuilt PDF and original manuscript source identity
        shell: bash
        run: |
          set -euo pipefail
          cmp docs/paper/aaaii/pd-bg-rfm.tex docs/paper/RemoteSensing_AAAI_Rebuild/pd-bg-rfm.tex
          cmp docs/paper/aaaii/paper0726.tex docs/paper/RemoteSensing_AAAI_Rebuild/paper0726.tex
          test -s docs/paper/RemoteSensing_AAAI_Rebuild/pd-bg-rfm.pdf
          python - <<'PY'
          from pypdf import PdfReader
          from pathlib import Path
          p=Path("docs/paper/RemoteSensing_AAAI_Rebuild/pd-bg-rfm.pdf")
          print("REBUILT_PDF_PAGES",len(PdfReader(str(p)).pages),"BYTES",p.stat().st_size)
          PY
          echo 'MANUSCRIPT_BUILD_WITH_UPLOADED_PDFS_PASS'

      - name: Upload AAAI source reconstruction PDF
        uses: actions/upload-artifact@v4
        with:
          name: aaai-step0-uploaded-figures-rebuilt-pdf
          path: docs/paper/RemoteSensing_AAAI_Rebuild/pd-bg-rfm.pdf
          if-no-files-found: error

      - name: Package Step-0 restored source and figure assets
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p build/aaai-original-restoration
          tar --exclude='*.aux' --exclude='*.log' --exclude='*.fls' \
            --exclude='*.fdb_latexmk' --exclude='*.bbl' --exclude='*.blg' \
            --exclude='pd-bg-rfm.pdf' \
            -czf build/aaai-original-restoration/AAAI_STEP0_WITH_UPLOADED_PDFS.tar.gz \
            -C docs/paper RemoteSensing_AAAI_Rebuild

      - name: Upload Step-0 source archive
        uses: actions/upload-artifact@v4
        with:
          name: aaai-step0-uploaded-figures-source
          path: build/aaai-original-restoration/AAAI_STEP0_WITH_UPLOADED_PDFS.tar.gz
          if-no-files-found: error
