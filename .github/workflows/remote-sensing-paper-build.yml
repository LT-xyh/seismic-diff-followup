name: remote-sensing-paper-build

on:
  push:
    branches:
      - remote-sensing/submission-sprint
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Render restored AAAI-derived vector figures
        run: |
          python -m pip install --disable-pip-version-check svgwrite==1.4.3 CairoSVG==2.8.2
          python docs/paper/RemoteSensing/figures/render_restored_artwork.py

      - name: Upload restored figure previews
        uses: actions/upload-artifact@v4
        with:
          name: rs-restored-figure1-preview
          path: |
            docs/paper/RemoteSensing/figures/figure1_bg_rfm_restored_preview.png
            docs/paper/RemoteSensing/figures/figure1_bg_rfm_restored.svg
            docs/paper/RemoteSensing/figures/figure1_bg_rfm_restored.pdf
          if-no-files-found: error


      - name: Compile unified manuscript
        uses: xu-cheng/latex-action@v4
        with:
          root_file: main.tex
          working_directory: docs/paper/RemoteSensing
          latexmk_use_xelatex: false

      - name: Assemble minimal self-contained source ZIP
        run: |
          python docs/paper/RemoteSensing/submission/package_submission.py

      - name: Verify isolated source build
        uses: xu-cheng/latex-action@v4
        with:
          root_file: main.tex
          working_directory: build/remote-sensing/isolated-source/RemoteSensing
          latexmk_use_xelatex: false

      - name: Check PDF compilation and hyperlink destinations
        shell: bash
        run: |
          set -euo pipefail
          source_dir=build/remote-sensing/isolated-source/RemoteSensing
          test -s docs/paper/RemoteSensing/main.pdf
          test -s "$source_dir/main.pdf"
          test -s build/remote-sensing/BG-RFM_RemoteSensing_PREVIEW_source.zip
          if grep -Eiq "destination with the same identifier|There were undefined references|There were undefined citations" "$source_dir/main.log"; then
            echo "Failed: duplicate PDF anchor or unresolved reference/citation"
            exit 1
          fi
          mkdir -p build/remote-sensing/delivery
          cp "$source_dir/main.pdf" build/remote-sensing/delivery/BG-RFM_RemoteSensing_PREVIEW.pdf

      - name: Upload manuscript PDF preview
        uses: actions/upload-artifact@v4
        with:
          name: remote-sensing-manuscript-PREVIEW
          path: build/remote-sensing/delivery/BG-RFM_RemoteSensing_PREVIEW.pdf
          if-no-files-found: error

      - name: Upload minimal source ZIP preview
        uses: actions/upload-artifact@v4
        with:
          name: remote-sensing-source-PREVIEW
          path: build/remote-sensing/BG-RFM_RemoteSensing_PREVIEW_source.zip
          if-no-files-found: error
