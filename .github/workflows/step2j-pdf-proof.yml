name: BG-RFM Step2J PDF and pagination proof
on:
  push:
    branches:
      - remote-sensing/step2j-pdf-proof-20261016
  workflow_dispatch:

jobs:
  compile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Verify additive-only scientific source revision
        shell: bash
        run: |
          python - <<'PY'
          import difflib
          from pathlib import Path
          root=Path("docs/paper/RemoteSensing_Stepwise")
          old=(root/"CONTENT_STEP2I_AI_DISCLOSURE_MARKED.tex").read_text()
          new=(root/"CONTENT_STEP2J_MARKED.tex").read_text()
          oldlines=old.splitlines(keepends=True)
          newlines=new.splitlines(keepends=True)
          ops=difflib.SequenceMatcher(a=oldlines,b=newlines,autojunk=False).get_opcodes()
          assert all(kind in ("equal","insert") for kind,*rest in ops), "Existing scientific content was changed"
          for key in ("A1","A2","B1","B2","C1","C2","D1","D2","E1"):
              assert new.count("BG-REV 2J-"+key+":")==1, key
          assert new.count(r"\BGRevAdd{")==old.count(r"\BGRevAdd{")+9
          assert new.count(r"\label{")==old.count(r"\label{")
          assert new.count(r"\cite{")==old.count(r"\cite{")
          assert (root/"main.tex").read_text().count(r"\input{CONTENT_STEP2J_MARKED}")==1
          print("PASS: nine purely additive blue-marked paragraphs; all original source lines preserved")
          PY

      - name: Prepare existing bundled MDPI class
        run: |
          mkdir -p docs/paper/RemoteSensing_Stepwise/Definitions
          cp -a docs/paper/RemoteSensing/mdpi/Definitions/. docs/paper/RemoteSensing_Stepwise/Definitions/
          grep -m1 '\ProvidesClass' docs/paper/RemoteSensing_Stepwise/Definitions/mdpi.cls

      - name: Compile marked proof
        uses: xu-cheng/latex-action@v4
        with:
          root_file: main.tex
          working_directory: docs/paper/RemoteSensing_Stepwise
          latexmk_use_xelatex: false

      - name: Save marked and toggle clean in runner only
        shell: bash
        run: |
          mkdir -p build/step2j
          cp docs/paper/RemoteSensing_Stepwise/main.pdf build/step2j/BG-RFM_Step2J_MARKED.pdf
          python - <<'PY'
          from pathlib import Path
          p=Path("docs/paper/RemoteSensing_Stepwise/main.tex")
          s=p.read_text()
          assert s.count(r"\BGshowrevisionstrue")==1
          p.write_text(s.replace(r"\BGshowrevisionstrue",r"\BGshowrevisionsfalse",1))
          PY

      - name: Compile clean proof
        uses: xu-cheng/latex-action@v4
        with:
          root_file: main.tex
          working_directory: docs/paper/RemoteSensing_Stepwise
          latexmk_use_xelatex: false

      - name: Verify bibliography, PDF pagination and text content
        shell: bash
        run: |
          set -euo pipefail
          src=docs/paper/RemoteSensing_Stepwise
          cp "$src/main.pdf" build/step2j/BG-RFM_Step2J_CLEAN.pdf
          test -s build/step2j/BG-RFM_Step2J_MARKED.pdf
          test -s build/step2j/BG-RFM_Step2J_CLEAN.pdf
          test -s "$src/main.bbl"
          grep -Fq '\bibdata{references}' "$src/main.aux"
          if grep -Eiq 'duplicate ignored|destination with the same identifier|There were undefined references|There were undefined citations|Reference .* undefined|Citation .* undefined' "$src/main.log"; then
            echo "Invalid citation or duplicate anchor"; exit 1
          fi
          python -m pip install --quiet pymupdf
          python - <<'PY'
          import fitz, re, json, collections
          from pathlib import Path
          folder=Path("build/step2j")
          marked=fitz.open(folder/"BG-RFM_Step2J_MARKED.pdf")
          clean=fitz.open(folder/"BG-RFM_Step2J_CLEAN.pdf")
          def find_heading(doc, heading):
              for pageidx,page in enumerate(doc):
                  if heading in page.get_text():return pageidx+1
              raise AssertionError("Cannot find heading: "+heading)
          assert len(marked)==len(clean), "Marked and clean pagination differs"
          conclusion=find_heading(clean,"6. Conclusions")
          appendix=find_heading(clean,"Appendix A. Theoretical Derivations and Proofs")
          references=find_heading(clean,"References")
          assert conclusion>=18, f"Conclusions only on page {conclusion}"
          assert appendix>=19, f"Appendix A starts on page {appendix}"
          assert conclusion<appendix<references
          assert "common numerical reference connecting" in clean[conclusion-1].get_text(), "Conclusions do not finish on the page identified"
          words=lambda doc:collections.Counter(
              w[4] for p in doc for w in p.get_text("words") if w[0]<564
          )
          assert words(marked)==words(clean), "Marked/clean scientific word content differs"
          info={"marked_pages":len(marked),"clean_pages":len(clean),
                "conclusions_page":conclusion,"appendix_a_page":appendix,
                "references_first_page":references,"scientific_main_pages":conclusion,
                "content_counter_identical":True}
          (folder/"STEP2J_PDF_CHECK.json").write_text(json.dumps(info,indent=2))
          print(info)
          PY

      - name: Package exact source and provenance
        shell: bash
        run: |
          set -euo pipefail
          folder=docs/paper/RemoteSensing_Stepwise
          mkdir -p build/step2j/source
          cp "$folder/main.tex" build/step2j/source/main.tex
          sed -i 's/\\BGshowrevisionsfalse/\\BGshowrevisionstrue/' build/step2j/source/main.tex
          cp "$folder/CONTENT_STEP2J_MARKED.tex" "$folder/CONTENT_STEP2I_AI_DISCLOSURE_MARKED.tex" \
             "$folder/references.bib" "$folder/REVISION_LEDGER.md" "$folder/REVISION_MARKING_RULE.md" \
             build/step2j/source/
          cp -a "$folder/figures" "$folder/Definitions" build/step2j/source/
          (cd build/step2j/source && zip -qr ../BG-RFM_Step2J_SOURCE.zip .)
          test -s build/step2j/BG-RFM_Step2J_SOURCE.zip

      - name: Upload Step2J complete delivery
        uses: actions/upload-artifact@v4
        with:
          name: BG-RFM-Step2J-Delivery
          path: |
            build/step2j/BG-RFM_Step2J_MARKED.pdf
            build/step2j/BG-RFM_Step2J_CLEAN.pdf
            build/step2j/BG-RFM_Step2J_SOURCE.zip
            build/step2j/STEP2J_PDF_CHECK.json
          if-no-files-found: error
