data:
  name: synthetic
  root_dir: null
  root_candidates: []
  use_normalize: "-1_1"
  storage_backend: auto
  lmdb_root: /public/home/xuyinghao/workspace/datasets/openfwi_lmdb
  normalization_profile: auto
  normalize_clamp: true
  target_shape: null
  well_count_range: [0, 3]
  well_seed: 1234
  well_random: null
  val_split: val
  split_fractions: [0.7, 0.2, 0.1]
  split_seed: 42
  val_fraction: null
  openfwi_datasets: [CurveVelA]
  required_modalities: [depth_vel]
  train_length: 8
  val_length: 4
  test_length: 4

benchmark:
  variant: bg_pdr_fm
  capacity_tier: matched
  generator_hidden_channels: 64
  direct_hidden_channels: 64
  full_field_backend: simple_fm

model:
  hidden_channels: 8
  base_channels: 16
  feature_channels: 8
  cond_channels: 16
  background_hidden_channels: 16
  latent_channels: 4
  latent_hw: [18, 18]
  codec_type: simple
  codec_checkpoint: null
  codec_module_path: null
  lowpass_kernel: 5
  use_unique: false
  unique_eta: 0.1
  rho_tau: 1.0
  residual_backend: simple_fm
  residual_num_train_timesteps: 100
  residual_num_inference_steps: 2
  residual_loss_type: mse

loss:
  bg_weight: 1.0
  bg_high_weight: 0.05
  rho_weight: 0.0
  final_l1_weight: 1.0
  target_lf_weight: 0.1

quality_gate:
  mode: none

contrastive:
  embed_dim: 16
  hidden_dim: null
  temperature: 0.1
  symile_structural_weight: 1.0
  symile_numerical_weight: 1.0
  anchor_weight: 0.5
  reliability_prior_weight: 0.05
  sn_ortho_weight: 0.05
  unique_ortho_weight: 0.05
  min_symile_group_size: 2
  strict_derangement: true
  wavelet:
    level: 1
    boundary: edge
    resize_mode: nearest
    detail_fusion: l2

training:
  stage: residual
  fast_run: true
  freeze_encoder: false
  load_stage_checkpoint: null
  save_stage_outputs: false
  stage_checkpoint_path: logs/bg_pdr_fm/aaai27/stage_checkpoints
  lr: 1e-4
  max_epochs: 1
  batch_size: 4
  num_workers: 0
  persistent_workers: false
  prefetch_factor: null
  pin_memory: false
  precision: 32-true
  matmul_precision: medium
  accelerator: cpu
  devices: 1
  limit_train_batches: 1
  limit_val_batches: 1
  log_every_n_steps: 1
  logging:
    log_dir: logs/bg_pdr_fm/aaai27/lightning
    log_version: "{stage}_{time}"
    add_timestamp: false
  checkpoint:
    dirpath: logs/bg_pdr_fm/aaai27/lightning/checkpoints
    filename: "aaai27-{epoch}-loss{val/loss:.4f}"
    monitor: val/loss
    mode: min
    save_top_k: 1
    save_last: true
    every_n_epochs: 1

diagnostics:
  enabled: false
  output_dir: logs/bg_pdr_fm/aaai27/diagnostics

evaluation:
  output_dir: logs/bg_pdr_fm/aaai27/evaluation
  split: test
  max_batches: 1
  save_arrays: false
  save_panels: false
  allow_untrained: true
  checkpoint: null
  missing_modes:
    - full
    - w/o well_log
    - w/o horizon
    - w/o rms_vel
    - w/o well+rms
    - PSTM only
