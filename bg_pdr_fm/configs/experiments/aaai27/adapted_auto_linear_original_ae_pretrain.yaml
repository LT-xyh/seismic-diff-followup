extends: _base_formal.yaml

benchmark:
  variant: adapted_auto_linear_original
  capacity_tier: adapted_external
  auto_linear_phase: ae_pretrain
  auto_linear_input_hw: [1000, 70]
  auto_linear_mask_ratio: 0.75
  auto_linear_converter_rank: 128

training:
  freeze_encoder: true
  load_stage_checkpoint: null
  max_epochs: 100
  batch_size: 300
  devices: 1
  num_workers: 8
  persistent_workers: true
  prefetch_factor: 4
  logging:
    log_dir: logs/bg_pdr_fm/aaai27/formal/adapted_auto_linear_original_ae_pretrain/lightning
    log_version: "adapted_auto_linear_original_ae_pretrain_{time}"
  checkpoint:
    dirpath: logs/bg_pdr_fm/aaai27/formal/adapted_auto_linear_original_ae_pretrain/checkpoints
    filename: "adapted-auto-linear-original-ae-{epoch}-loss{val/loss:.4f}"

evaluation:
  output_dir: logs/bg_pdr_fm/aaai27/eval_adapted_auto_linear_original_ae_pretrain/adapted_auto_linear_original
  checkpoint: logs/bg_pdr_fm/aaai27/formal/adapted_auto_linear_original_ae_pretrain/checkpoints/last.ckpt
  missing_modes:
    - full
