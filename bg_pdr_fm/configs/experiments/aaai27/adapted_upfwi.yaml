extends: _base_formal.yaml

benchmark:
  variant: adapted_upfwi
  capacity_tier: adapted_external
  adapted_upfwi_input_hw: [1000, 70]

training:
  freeze_encoder: true
  load_stage_checkpoint: null
  max_epochs: 100
  batch_size: 64
  num_workers: 8
  persistent_workers: true
  prefetch_factor: 4
  precision: 32-true
  weight_decay: 1e-4
  scheduler: none
  devices: 1
  logging:
    log_dir: logs/bg_pdr_fm/aaai27/formal/adapted_upfwi_official_e100/lightning
    log_version: "adapted_upfwi_official_e100_{time}"
  checkpoint:
    dirpath: logs/bg_pdr_fm/aaai27/formal/adapted_upfwi_official_e100/checkpoints
    filename: "adapted-upfwi-official-e100-{epoch}-loss{val/loss:.4f}"

evaluation:
  output_dir: logs/bg_pdr_fm/aaai27/eval_adapted_upfwi_official_e100/adapted_upfwi_official_e100
  checkpoint: logs/bg_pdr_fm/aaai27/formal/adapted_upfwi_official_e100/checkpoints/last.ckpt
  missing_modes:
    - full
