extends: conditional_ddpm.yaml

training:
  num_workers: 8
  persistent_workers: true
  prefetch_factor: 4
  dataloader_multiprocessing_context: spawn
  logging:
    log_dir: logs/bg_pdr_fm/aaai27/formal/conditional_ddpm_direct_highio/lightning
    log_version: "conditional_ddpm_direct_highio_{time}"
  checkpoint:
    dirpath: logs/bg_pdr_fm/aaai27/formal/conditional_ddpm_direct_highio/checkpoints
    filename: "conditional-ddpm-direct-highio-{epoch}-loss{val/loss:.4f}"

evaluation:
  output_dir: logs/bg_pdr_fm/aaai27/eval_conditional_ddpm_direct_highio/conditional_ddpm
  checkpoint: logs/bg_pdr_fm/aaai27/formal/conditional_ddpm_direct_highio/checkpoints/last.ckpt
