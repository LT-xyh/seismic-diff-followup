extends: _base_formal.yaml

benchmark:
  variant: adapted_gfi
  capacity_tier: adapted_external
  adapted_gfi_base_channels: 32
  adapted_gfi_input_hw: [1000, 70]

training:
  freeze_encoder: true
  load_stage_checkpoint: null
  max_epochs: 200
  batch_size: 192
  devices: 1
  logging:
    log_dir: logs/bg_pdr_fm/aaai27/formal/adapted_gfi_multimodal/lightning
    log_version: "formal_adapted_gfi_multimodal_{time}"
  checkpoint:
    dirpath: logs/bg_pdr_fm/aaai27/formal/adapted_gfi_multimodal/checkpoints
    filename: "adapted-gfi-multimodal-{epoch}-loss{val/loss:.4f}"

evaluation:
  output_dir: logs/bg_pdr_fm/aaai27/eval_adapted_gfi_multimodal/adapted_gfi_multimodal
  checkpoint: logs/bg_pdr_fm/aaai27/formal/adapted_gfi_multimodal/checkpoints/last.ckpt
  missing_modes:
    - full
