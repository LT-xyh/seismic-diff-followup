extends: _base_formal.yaml

benchmark:
  variant: adapted_gfi
  capacity_tier: adapted_external
  adapted_gfi_base_channels: 32
  adapted_gfi_input_hw: [1000, 70]

training:
  freeze_encoder: true
  load_stage_checkpoint: null
  max_epochs: 100
  batch_size: 300
  devices: 4
  strategy: ddp
  logging:
    log_dir: logs/bg_pdr_fm/aaai27/formal/adapted_gfi_multimodal_e100/lightning
    log_version: "formal_adapted_gfi_multimodal_e100_{time}"
  checkpoint:
    dirpath: logs/bg_pdr_fm/aaai27/formal/adapted_gfi_multimodal_e100/checkpoints
    filename: "adapted-gfi-multimodal-e100-{epoch}-loss{val/loss:.4f}"

evaluation:
  output_dir: logs/bg_pdr_fm/aaai27/eval_adapted_gfi_multimodal_e100/adapted_gfi_multimodal_e100
  checkpoint: logs/bg_pdr_fm/aaai27/formal/adapted_gfi_multimodal_e100/checkpoints/last.ckpt
  missing_modes:
    - full
