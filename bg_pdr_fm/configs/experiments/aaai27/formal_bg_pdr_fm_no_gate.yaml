    dirpath: logs/bg_pdr_fm/aaai27/formal/bg_pdr_fm_no_gate/checkpoints
    filename: "bg-pdr-fm-no-gate-{epoch}-loss{val/loss:.4f}"

evaluation:
  output_dir: logs/bg_pdr_fm/aaai27/formal/bg_pdr_fm_no_gate/evaluation
