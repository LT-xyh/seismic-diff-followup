extends: _base_formal.yaml

benchmark:
  variant: concat_fm
  capacity_tier: strong
  generator_hidden_channels: 256
  direct_hidden_channels: 256
  full_field_backend: simple_fm

training:
  logging:
    log_dir: logs/bg_pdr_fm/aaai27/formal/concat_fm_strong/lightning
    log_version: "formal_concat_fm_strong_{time}"
  checkpoint:
    dirpath: logs/bg_pdr_fm/aaai27/formal/concat_fm_strong/checkpoints
    filename: "concat-fm-strong-{epoch}-loss{val/loss:.4f}"

evaluation:
  output_dir: logs/bg_pdr_fm/aaai27/formal/concat_fm_strong/evaluation
  checkpoint: logs/bg_pdr_fm/aaai27/formal/concat_fm_strong/checkpoints/last.ckpt
