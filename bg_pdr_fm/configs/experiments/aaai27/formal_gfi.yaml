# External GFI baseline placeholder.
#
# This file records the paper-table identity and official input contract for
# GFI. It is not consumed by the internal AAAI27BenchmarkLightning trainer,
# because GFI must be run through its official external repository:
# https://github.com/KGML-lab/Generalized-Forward-Inverse-Framework-for-DL4SI

benchmark:
  variant: gfi
  provenance: external_published
  venue: ICLR
  year: 2025
  paper: "A Unified Framework for Forward and Inverse Problems in Subsurface Imaging using Latent Space Translations"
  official_repo: https://github.com/KGML-lab/Generalized-Forward-Inverse-Framework-for-DL4SI
  audited_commit: cd0443b6f6463196e89ef2ea4ac775baf753ef39
  input_contract: waveform_amplitude
  input_shape: [5, 1000, 70]
  output_shape: [1, 70, 70]
  comparison_status: external_native_or_adapted

reproduction:
  mode: external_official_repo
  smoke_status: official_inverse_smoke_and_500_sample_probe_passed
  formal_status: blocked_pending_full_raw_waveform_split
  smoke_date: "2026-06-15"
  probe_date: "2026-06-16"
  data_audit_date: "2026-06-16"
  local_bridge: bg_pdr_fm/external_baselines/gfi
  external_checkout: /public/home/xuyinghao/workspace/external_repos/gfi
  isolated_env: /public/home/xuyinghao/workspace/external_repos/gfi_venv
  smoke_data: /public/home/xuyinghao/workspace/datasets/Datasets/data1.npy
  smoke_label: /public/home/xuyinghao/workspace/datasets/Datasets/model1.npy
  available_raw_waveform_arrays:
    - data: /public/home/xuyinghao/workspace/datasets/Datasets/data1.npy
      label: /public/home/xuyinghao/workspace/datasets/Datasets/model1.npy
      data_shape: [500, 5, 1000, 70]
      label_shape: [500, 1, 70, 70]
      status: probe_only_not_formal_split
  full_raw_waveform_split:
    status: not_found_in_current_workspace
    required_families:
      - FlatVelA
      - FlatVelB
      - CurveVelA
      - CurveVelB
    required_contract: "[N,5,1000,70] waveform amplitudes paired with [N,1,70,70] velocity labels"
  smoke_annotation: /tmp/gfi_smoke/smoke.txt
  smoke_dataset: /tmp/gfi_smoke/smoke_dataset2_indexable.pt
  smoke_log: /tmp/gfi_smoke/official_smoke.log
