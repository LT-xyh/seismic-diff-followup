    - "Use this as a native waveform-to-velocity external baseline, or explicitly label any same-input multimodal adapter as adapted GFI."
    - "The 2026-06-15 smoke verifies official-code train/val forward/backward and local metric bridging only; it is not a benchmark result."
    - "The 2026-06-16 mini-probe verifies the runner over the available 500-sample arrays only; it is not a formal OpenFWI split result."
    - "Do not put GFI in a paper result table until a complete raw waveform split is available or a same-input adapted GFI protocol is explicitly defined."
