    num_blocks: 1
    unet_repeat_blocks: 1
    num_samples: 500
  train_script: src/train_inverse.py
  metric_adapter: bg_pdr_fm.external_baselines.gfi.evaluate_gfi_predictions
  metric_adapter_outputs:
