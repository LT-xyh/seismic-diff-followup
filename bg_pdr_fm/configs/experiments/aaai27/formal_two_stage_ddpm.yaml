extends: _base_formal.yaml

benchmark:
  variant: two_stage_ddpm
  capacity_tier: reference
  generator_hidden_channels: 96
  freeze_background_branch: true

model:
  residual_backend: simple_ddpm
  residual_num_train_timesteps: 1000
  residual_num_inference_steps: 50

loss:
  rho_weight: 0.05

quality_gate:
  mode: learned

training:
  load_stage_checkpoint: logs/bg_pdr_fm/background_train_hc16_lh01/lightning/checkpoints/background_hc16_lh01-epoch_96-loss0.0801.ckpt
  logging:
    log_dir: logs/bg_pdr_fm/aaai27/formal/two_stage_ddpm/lightning
    log_version: "formal_two_stage_ddpm_{time}"
  checkpoint:
    dirpath: logs/bg_pdr_fm/aaai27/formal/two_stage_ddpm/checkpoints
    filename: "two-stage-ddpm-{epoch}-loss{val/loss:.4f}"

evaluation:
  output_dir: logs/bg_pdr_fm/aaai27/formal/two_stage_ddpm/evaluation
  checkpoint: logs/bg_pdr_fm/aaai27/formal/two_stage_ddpm/checkpoints/last.ckpt
