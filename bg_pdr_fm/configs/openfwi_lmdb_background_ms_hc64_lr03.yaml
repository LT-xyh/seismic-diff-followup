data:
  name: openfwi
  root_dir: /public/home/xuyinghao/workspace/datasets/openfwi
  root_candidates:
    - /public/home/xuyinghao/workspace/datasets/openfwi
  use_normalize: "-1_1"
  storage_backend: lmdb
  lmdb_root: /public/home/xuyinghao/workspace/datasets/openfwi_lmdb
  normalization_profile: auto
  normalize_clamp: true
  target_shape: null
  well_count_range: [0, 3]
  well_seed: 1234
  well_random: null
  val_split: val
  split_fractions: [0.7, 0.2, 0.1]
  split_seed: 42
  val_fraction: null
  openfwi_datasets:
    - FlatVelA
    - FlatVelB
    - CurveVelA
    - CurveVelB
    - FlatFaultA
    - FlatFaultB
    - CurveFaultA
    - CurveFaultB
  required_modalities:
    - depth_vel
    - migrated_image
    - horizon
    - rms_vel

model:
  hidden_channels: 16
  base_channels: 32
  feature_channels: 16
  cond_channels: 32
  background_hidden_channels: 64
  latent_channels: 4
  latent_hw: [18, 18]
  codec_type: autoencoder
  codec_checkpoint: checkpoints/bg_pdr_fm/seismic_autoencoder_kl.ckpt
  codec_module_path: null
  lowpass_kernel: 5
  use_unique: false
  unique_eta: 0.1
  rho_tau: 1.0
  residual_backend: simple_fm
  residual_num_train_timesteps: 1000
  residual_num_inference_steps: 20
  residual_loss_type: mse

loss:
  bg_high_weight: 0.15
  bg_multiscale_weight: 0.5
  bg_multiscale_high_weight: 0.1
  bg_scales: [5, 9, 17]
  bg_low_residual_weight: 0.3
  bg_low_residual_kernel: 9
  rho_weight: 0.0
  final_l1_weight: 1.0
  target_lf_weight: 0.1

quality_gate:
  mode: none

contrastive:
  embed_dim: 128
  hidden_dim: null
  temperature: 0.1
  symile_structural_weight: 1.0
  symile_numerical_weight: 1.0
  anchor_weight: 0.5
  reliability_prior_weight: 0.05
  sn_ortho_weight: 0.05
  unique_ortho_weight: 0.05
  min_symile_group_size: 2
  strict_derangement: true
  diagnostics:
    frequency_metrics: true
    reliability_metrics: true
    subset_metrics: true
  modality_dropout:
    enabled: false
    probs:
      migrated_image: 0.0
      horizon: 0.0
      rms_vel: 0.0
      well_log: 0.0
  wavelet:
    level: 1
    boundary: edge
    resize_mode: nearest
    detail_fusion: l2

training:
  stage: background
  fast_run: false
  fast_run_stages: null
  freeze_encoder: false
  load_stage_checkpoint: logs/bg_pdr_fm/background_train_ms_hc64/stage_checkpoints/background_last.ckpt
  save_stage_outputs: true
  stage_checkpoint_path: logs/bg_pdr_fm/background_train_ms_hc64_lr03/stage_checkpoints
  lr: 1e-4
  max_epochs: 30
  batch_size: 100
  num_workers: 4
  persistent_workers: true
  prefetch_factor: 3
  pin_memory: true
  precision: bf16-mixed
  matmul_precision: medium
  accelerator: gpu
  devices: 4
  limit_train_batches: null
  limit_val_batches: null
  log_every_n_steps: 10
  logging:
    log_dir: logs/bg_pdr_fm/background_train_ms_hc64_lr03/lightning
    log_version: background_ms_hc64_lr03
  checkpoint:
    dirpath: logs/bg_pdr_fm/background_train_ms_hc64_lr03/lightning/checkpoints
    filename: background_ms_hc64_lr03-epoch_{epoch}-loss{val/loss:.4f}
    monitor: val/loss
    mode: min
    save_top_k: 3
    save_last: true
    every_n_epochs: 1

diagnostics:
  enabled: true
  output_dir: logs/bg_pdr_fm/background_train_ms_hc64_lr03/diagnostics

evaluation:
  output_dir: logs/bg_pdr_fm/background_train_ms_hc64_lr03/evaluation
  split: test
  max_batches: null
  save_arrays: true
  save_panels: true
  allow_untrained: false
  checkpoints:
    full: null
    contrastive: logs/bg_pdr_fm/contrastive_train/stage_checkpoints/contrastive_last.ckpt
    background: logs/bg_pdr_fm/background_train_ms_hc64_lr03/stage_checkpoints/background_last.ckpt
    residual: null

