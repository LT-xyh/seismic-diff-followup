data:
  name: openfwi
  root_dir: /public/home/xuyinghao/workspace/datasets/openfwi
  root_candidates:
    - /public/home/xuyinghao/workspace/datasets/openfwi
  use_normalize: "-1_1"
  storage_backend: lmdb
  lmdb_root: /public/home/xuyinghao/workspace/datasets/openfwi_lmdb
  normalization_profile: auto
  normalize_clamp: true
  target_shape: null
  well_count_range: [0, 3]
  well_seed: 1234
  well_random: null
  val_split: val
  split_fractions: [0.7, 0.2, 0.1]
  split_seed: 42
  val_fraction: null
  openfwi_datasets:
    - FlatVelA
    - FlatVelB
    - CurveVelA
    - CurveVelB
    - FlatFaultA
    - FlatFaultB
    - CurveFaultA
    - CurveFaultB
  required_modalities:
    - depth_vel
    - migrated_image
    - horizon
    - rms_vel

model:
  hidden_channels: 16
  base_channels: 32
  feature_channels: 16
  cond_channels: 32
  background_backend: unet_direct
  background_condition_source: encoder_numerical
  background_hidden_channels: 192
  background_output_mode: direct
  latent_channels: 4
  latent_hw: [18, 18]
  codec_type: autoencoder
  codec_checkpoint: checkpoints/bg_pdr_fm/seismic_autoencoder_kl.ckpt
  codec_module_path: null
  lowpass_kernel: 5
  use_unique: false
  unique_eta: 0.1
  rho_tau: 1.0
  residual_backend: simple_fm
  residual_num_train_timesteps: 1000
  residual_num_inference_steps: 20
  residual_loss_type: mse

loss:
  bg_l1_weight: 1.0
  bg_l2_weight: 0.5
  bg_high_weight: 0.0
  rho_weight: 0.0
  final_l1_weight: 1.0
  target_lf_weight: 0.1

quality_gate:
  mode: none

contrastive:
  embed_dim: 128
  hidden_dim: null
  temperature: 0.1
  symile_structural_weight: 1.0
  symile_numerical_weight: 1.0
  anchor_weight: 0.5
  reliability_prior_weight: 0.05
  sn_ortho_weight: 0.05
  unique_ortho_weight: 0.05
  min_symile_group_size: 2
  strict_derangement: true
  wavelet:
    level: 1
    boundary: edge
    resize_mode: nearest
    detail_fusion: l2

training:
  stage: background
  lr: 1e-3
  max_epochs: 10
  batch_size: 400
  num_workers: 4
  persistent_workers: true
  prefetch_factor: 3
  pin_memory: true
  precision: bf16-mixed
  matmul_precision: medium
  accelerator: gpu
  devices: 1
  limit_train_batches: null
  limit_val_batches: null

diagnostic:
  output_dir: logs/bg_pdr_fm/bg_feature_diagnostic/linear_mlp_oracle_bg
  probes:
    - linear_1x1
    - mlp_1x1
  probe_hidden_channels: 32

evaluation:
  output_dir: logs/bg_pdr_fm/bg_feature_diagnostic/linear_mlp_oracle_bg
  split: test
  max_batches: 10
  save_arrays: false
  save_panels: false
  allow_untrained: false
  checkpoints:
    contrastive: logs/bg_pdr_fm/contrastive_train/stage_checkpoints/contrastive_last.ckpt
