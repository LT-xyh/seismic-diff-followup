data:
  name: openfwi
  root_dir: /public/home/xuyinghao/workspace/datasets/openfwi
  root_candidates:
    - /public/home/xuyinghao/workspace/datasets/openfwi
  use_normalize: "-1_1"
  storage_backend: lmdb
  lmdb_root: /public/home/xuyinghao/workspace/datasets/openfwi_lmdb
  normalization_profile: auto
  normalize_clamp: true
  target_shape: null
  well_count_range: [0, 3]
  well_seed: 1234
  well_random: null
  val_split: val
  split_fractions: [0.7, 0.2, 0.1]
  split_seed: 42
  val_fraction: null
  openfwi_datasets:
    - FlatVelA
    - FlatVelB
    - CurveVelA
    - CurveVelB
    - FlatFaultA
    - FlatFaultB
    - CurveFaultA
    - CurveFaultB
  required_modalities:
    - depth_vel
    - migrated_image
    - horizon
    - rms_vel

model:
  hidden_channels: 16
  base_channels: 32
  feature_channels: 16
  lowpass_kernel: 5
  use_unique: false

quality_gate:
  mode: none

loss:
  target_lf_weight: 0.1

contrastive:
  embed_dim: 128
  hidden_dim: null
  temperature: 0.08
  pairwise_temperature: 0.1
  symile_structural_weight: 0.25
  symile_numerical_weight: 0.25
  pairwise_structural_weight: 0.2
  pairwise_numerical_weight: 0.3
  pairwise_reliability_floor: 0.35
  anchor_weight: 0.10
  reliability_prior_weight: 0.05
  sn_ortho_weight: 0.02
  unique_ortho_weight: 0.02
  structural_highpass_weight: 0.005
  numerical_lowpass_weight: 0.005
  frequency_kernel_size: 5
  min_symile_group_size: 2
  strict_derangement: true
  num_negative_shuffles: 96
  diagnostics:
    frequency_metrics: true
    reliability_metrics: true
    subset_metrics: true
  modality_dropout:
    enabled: false
    probs:
      migrated_image: 0.0
      horizon: 0.0
      rms_vel: 0.0
      well_log: 0.0
  wavelet:
    level: 1
    boundary: edge
    resize_mode: nearest
    detail_fusion: l2

training:
  stage: contrastive
  fast_run: false
  fast_run_stages: null
  freeze_encoder: false
  load_stage_checkpoint: null
  save_stage_outputs: true
  stage_checkpoint_path: logs/bg_pdr_fm/contrastive_train/stage_checkpoints
  lr: 1e-4
  max_epochs: 100
  batch_size: 150
  num_workers: 8
  prefetch_factor: 2
  persistent_workers: true
  pin_memory: true
  precision: bf16-mixed
  matmul_precision: medium
  accelerator: gpu
  devices: [4, 5, 6, 7]
  strategy: ddp
  num_nodes: 1
  sync_batchnorm: false
  use_distributed_sampler: true
  limit_train_batches: null
  limit_val_batches: null
  log_every_n_steps: 10
  logging:
    log_dir: logs/bg_pdr_fm/contrastive_train/lightning
    log_version: contrastive_pairwise_recover_{time}
  checkpoint:
    dirpath: logs/bg_pdr_fm/contrastive_train/lightning/checkpoints
    filename: pairwise-epoch{epoch}-top5{val/pairwise_retrieval_top5:.4f}
    monitor: val/pairwise_retrieval_top5
    mode: max
    save_top_k: 5
    save_last: true
    every_n_epochs: 1

diagnostics:
  enabled: false
  output_dir: logs/bg_pdr_fm/contrastive_train/diagnostics

evaluation:
  output_dir: logs/bg_pdr_fm/contrastive_train/evaluation
  split: test
  max_batches: null
  save_arrays: true
  save_panels: true
  allow_untrained: false
  checkpoints:
    full: null
    contrastive: logs/bg_pdr_fm/contrastive_train/stage_checkpoints/contrastive_last.ckpt
    background: null
    residual: null
